<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to GitHub · GitHub</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="page">
        <main>
            <a class="brand" href="https://github.com/" aria-label="GitHub">
                <svg height="48" width="48" viewBox="0 0 16 16" aria-hidden="true">
                    <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 2.82c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
                </svg>
            </a>

            <h1>Sign in to GitHub</h1>

            <form class="auth-card" id="sign-in-form">
                <div class="field">
                    <label for="login">Username or email address</label>
                    <input id="login" name="login" type="text" autocomplete="username" autofocus>
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a class="forgot" href="https://github.com/password_reset">Forgot password?</a>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password">
                </div>

                <button class="sign-in" type="submit">Sign in</button>
                <p class="error" id="error-message" role="alert">Please enter your username and password.</p>
            </form>

            <div class="passkey">
                <a href="https://github.com/login?passkey=true">Sign in with a passkey</a>
            </div>

            <div class="new-account">
                New to GitHub? <a href="https://github.com/signup">Create an account</a>
            </div>
        </main>

        <footer>
            <nav class="footer-links" aria-label="Footer">
                <a href="https://docs.github.com/site-policy/github-terms/github-terms-of-service">Terms</a>
                <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement">Privacy</a>
                <a href="https://docs.github.com">Docs</a>
                <a href="https://support.github.com">Contact GitHub Support</a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
